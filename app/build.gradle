plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.myapplication'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId "com.example.myapplication"
        minSdk 24
        targetSdk 37
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            optimization {
                enable false
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        viewBinding true
    }
    androidResources {
        noCompress "tflite"
    }
}

dependencies {
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit

    // CameraX
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'

    // ML Kit Face Detection
    implementation 'com.google.mlkit:face-detection:16.1.6'

    // TensorFlow Lite
    // org.tensorflow:tensorflow-lite and its transitive org.tensorflow:tensorflow-lite-api both
    // declare the manifest namespace "org.tensorflow.lite", which this AGP version rejects as a
    // hard error. tensorflow-lite-api only supplies the interface classes tensorflow-lite's impl
    // implements (still required at compile+runtime), so instead of dropping it we substitute a
    // locally re-packaged copy (app/libs/tensorflow-lite-api-2.12.0-patched.aar) whose manifest
    // namespace was changed to "org.tensorflow.lite.api.unique". That attribute only affects
    // AGP's namespace/R-class bookkeeping for the AAR, not the Java package of its .class files,
    // so this is a safe, non-functional patch.
    implementation('org.tensorflow:tensorflow-lite:2.12.0') {
        exclude group: 'org.tensorflow', module: 'tensorflow-lite-api'
    }
    implementation(name: 'tensorflow-lite-api-2.12.0-patched', ext: 'aar')

    // Room
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // Location
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // Lifecycle (ViewModel + LiveData)
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.7.0'

    // RecyclerView + CardView
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
}